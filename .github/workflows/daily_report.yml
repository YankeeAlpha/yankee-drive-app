name: Yankee Drive – Denný Report & Synchronizácia Zákazníkov (20:00 SK)

on:
  schedule:
    # GitHub cron beží v UTC. Na Slovensku je zimný čas (CET = UTC+1).
    # 20:00 Europe/Bratislava = 19:00 UTC.
    # Spúšťame každých 15 minút medzi 18:30 a 20:30 UTC, aby sme eliminovali oneskorenie GitHub Actions serverov.
    - cron: '30 18 * * *'
    - cron: '45 18 * * *'
    - cron: '0 19 * * *'
    - cron: '15 19 * * *'
    - cron: '30 19 * * *'
    - cron: '45 19 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

# Workflow už nič necommituje do repa – stačí len čítanie.
permissions:
  contents: read

jobs:
  send-daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (Firebase servisný účet)
        run: pip install --quiet google-auth requests

      - name: Dátum pre značku odoslaného reportu
        id: day
        run: echo "date=$(TZ=Europe/Bratislava date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Značka "report dnes odoslaný" sa drží v GitHub Actions cache (nie v repe).
      - name: Načítať značku odoslaného reportu
        if: github.event_name == 'schedule'
        id: marker
        uses: actions/cache/restore@v4
        with:
          path: .report_sent
          key: report-sent-${{ steps.day.outputs.date }}

      - name: Synchronize Customers CSV & Send Daily Report at 20:00 Europe/Bratislava
        env:
          EVENT_NAME: ${{ github.event_name }}
          ZOHO_EMAIL: ${{ secrets.ZOHO_EMAIL }}
          ZOHO_ACCOUNT_ID: ${{ secrets.ZOHO_ACCOUNT_ID }}
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_REGION: ${{ secrets.ZOHO_REGION }}
          WELCOMIO_EMAIL: ${{ secrets.WELCOMIO_EMAIL }}
          WELCOMIO_PASSWORD: ${{ secrets.WELCOMIO_PASSWORD }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_NAME: ${{ secrets.META_PAGE_NAME }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_IG_USERNAME: ${{ secrets.META_IG_USERNAME }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_GBP_ACCOUNT: ${{ secrets.GOOGLE_GBP_ACCOUNT }}
          GOOGLE_GBP_LOCATION: ${{ secrets.GOOGLE_GBP_LOCATION }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 - << 'EOF'
          import os, subprocess, sys
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now_sk = datetime.now(ZoneInfo("Europe/Bratislava"))
          event = os.environ.get("EVENT_NAME", "")
          today_str = now_sk.strftime("%Y-%m-%d")
          print(f"Aktuálny čas na Slovensku: {now_sk.strftime('%Y-%m-%d %H:%M:%S %Z')} (event={event})")

          # Marker súbor pre zabránenie duplicitnému odoslaniu v ten istý deň
          marker_file = Path(".report_sent")

          if event == "schedule":
              # Ak už bol report dnes odoslaný, ukončíme
              if marker_file.exists():
                  print(f"Denný report pre dnešný deň ({today_str}) už bol úspešne odoslaný.")
                  sys.exit(0)
              # Ak je čas pred 19:55 alebo po 23:00, preskočíme
              if now_sk.hour < 19 or (now_sk.hour == 19 and now_sk.minute < 55) or now_sk.hour >= 23:
                  print("Čakám na 20:00 Europe/Bratislava.")
                  sys.exit(0)

          print("Spúšťam dennú synchronizáciu a odoslanie reportu...")

          # 1. Synchronizácia zákazníkov a objednávok z Welcomio do Firestore.
          #    CSV/JSON s osobnými údajmi idú len do dočasného priečinka na runneri
          #    (mimo repa) a po skončení behu zaniknú. Obsluha si ich stiahne
          #    v internej aplikácii po prihlásení.
          subprocess.run(["python3", "tools/export_customers.py", "--output-dir", "/tmp/yd-exports"])

          # 2. Odoslanie denného reportu na servis@yankeedrive.sk
          res = subprocess.run(["python3", "tools/yankee_briefing.py", "--send-email", "--to", "servis@yankeedrive.sk"])
          if res.returncode == 0:
              marker_file.write_text(f"Sent at {now_sk.isoformat()}", encoding="utf-8")
              print("Denný report úspešne odoslaný a zaznamenaný.")
          sys.exit(res.returncode)
          EOF

      - name: Uložiť značku odoslaného reportu
        if: github.event_name == 'schedule' && hashFiles('.report_sent') != ''
        uses: actions/cache/save@v4
        with:
          path: .report_sent
          key: report-sent-${{ steps.day.outputs.date }}

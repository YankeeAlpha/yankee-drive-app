<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yankee Drive – Prepojenie TikTok API</title>
  <style>
    body {
      background: #0b0e14;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: #131824;
      border: 1px solid #eab308;
      border-radius: 20px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 18px 40px rgba(0,0,0,0.55);
    }
    .logo {
      width: 100px;
      height: 68px;
      object-fit: contain;
      background: #fff;
      padding: 6px 12px;
      border-radius: 12px;
      border: 2px solid #eab308;
      margin-bottom: 14px;
    }
    h1 { font-size: 20px; color: #eab308; margin: 0 0 8px; }
    p { font-size: 13px; color: #94a3b8; line-height: 1.5; }
    .code-box {
      background: #080a0f;
      border: 1px solid #2a3446;
      border-radius: 12px;
      padding: 14px;
      font-family: monospace;
      font-size: 14px;
      color: #22c55e;
      word-break: break-all;
      margin: 16px 0;
    }
    .btn {
      background: #eab308;
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="logo_yd.png" alt="Yankee Drive" class="logo" />
    <h1>🎵 TikTok Autorizácia – Yankee Drive</h1>
    <p id="statusText">Spracovávam autorizačný kód z TikToku...</p>
    <div id="codeBox" class="code-box">-</div>
    <button class="btn" onclick="copyCode()">📋 Skopírovať kód pre AI asistenta</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const err = params.get("error_description") || params.get("error");
    const box = document.getElementById("codeBox");
    const st = document.getElementById("statusText");

    if (code) {
      st.textContent = "✅ Úspešne pripojené! Skopírujte tento kód a pošlite ho do chatu svojmu AI asistentovi:";
      box.textContent = code;
    } else if (err) {
      st.textContent = "⚠️ Chyba pri autorizácii: " + err;
      box.textContent = err;
    } else {
      st.textContent = "Táto stránka slúži ako Redirect URI pre TikTok Developers (@yankeedrive).";
      box.textContent = window.location.origin + window.location.pathname;
    }

    function copyCode() {
      navigator.clipboard.writeText(box.textContent);
      alert("Skopírované! Vložte kód do chatu.");
    }
  </script>
</body>
</html>
